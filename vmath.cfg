# ---------------------------------------------------------------------------
# vmath - Free Pascal compiler configuration (route A: zero-install)
#
#   cd /path/to/vmath
#   fpc @vmath.cfg my_program.pas
#
# Paths are relative to the current directory: pass this file from the vmath
# checkout root so it also works when vmath is a git submodule.
# ---------------------------------------------------------------------------

-Mobjfpc
-Sh
-Fusrc
-Fisrc
-Isrc

# LightStrings (TStrList) is a required dependency. This path assumes the
# sibling checkout that ./setup.sh installs from; FPC ignores a unit path that
# does not exist, so the line is harmless once LightStrings lives in the FPC
# tree instead.  ./setup.sh --fu prints this path if your checkout is elsewhere.
-Fu../LightStrings/src
